[package]
authors = ["Nerivec"]
edition = "2021"
name = "serialport_napi_rs"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.0.0"

[dependencies.napi]
version = "3.0.0"
features = ["napi10"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
